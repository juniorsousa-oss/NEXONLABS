services:
  nexonhub:
    build:
      context: https://github.com/juniorsousa-oss/NEXONLABS.git#main
    restart: unless-stopped
    environment:
      APP_ENV: production
      COOKIE_SECURE: "1"
      APP_DISPLAY_NAME: "Equipe Nexon Labs"
      DATABASE_URL: ${DATABASE_URL}
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.nexonhub.rule=Host(`nexonhub.nexonlabs.com.br`)"
      - traefik.http.routers.nexonhub.entrypoints=websecure
      - traefik.http.routers.nexonhub.tls=true
      - traefik.http.routers.nexonhub.tls.certresolver=letsencrypt
      - traefik.http.services.nexonhub.loadbalancer.server.port=8000
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
