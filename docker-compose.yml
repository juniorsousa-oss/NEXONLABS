services:
  atria:
    build:
      context: https://github.com/juniorsousa-oss/NEXONLABS.git#main
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      COOKIE_SECURE: "1"
      APP_DISPLAY_NAME: "ATRIA by Nexon Labs"
      DATABASE_URL: ${DATABASE_URL}
      APP_PASSWORD: ${APP_PASSWORD}
      ATRIA_DEMO_PASSWORD: ${ATRIA_DEMO_PASSWORD}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Administrador ATRIA}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.atria.rule=Host(`atria.nexonlabs.com.br`)"
      - traefik.http.routers.atria.entrypoints=websecure
      - traefik.http.routers.atria.tls=true
      - traefik.http.routers.atria.tls.certresolver=letsencrypt
      - traefik.http.services.atria.loadbalancer.server.port=8000
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
