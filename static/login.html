<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexon Labs | Acesso</title><link rel="icon" type="image/svg+xml" href="/static/logo.svg"><link rel="stylesheet" href="/static/style.css?v=1"></head><body class="login-page"><main class="login-card"><img src="/static/logo.svg" width="72" height="72" alt=""><h1>NEXON LABS</h1><p>Gestão de projetos · Acesso restrito</p><form id="login-form"><label for="password">Senha de acesso</label><input id="password" type="password" autocomplete="current-password" required autofocus placeholder="Digite sua senha"><button class="primary" type="submit">Entrar</button><small id="login-error" role="alert"></small></form></main><script>document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();let el=document.querySelector('#login-error');el.textContent='';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});if(!r.ok){el.textContent=r.status===429?'Muitas tentativas. Aguarde alguns minutos antes de tentar novamente.':'Senha incorreta.';document.querySelector('#password').value='';return}document.querySelector('#password').value='';location.assign('/')}catch{el.textContent='Não foi possível conectar ao servidor.'}})</script></body></html>
