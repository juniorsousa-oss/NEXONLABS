services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atria
      POSTGRES_USER: atria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - atria-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atria -d atria"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  atria-postgres-data:
