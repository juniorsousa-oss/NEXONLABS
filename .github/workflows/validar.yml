name: Validar Nexon Labs
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'quotes_module.py'
      - 'tickets_module.py'
      - 'static/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript
        run: |
          node --check static/app.js
          node --check static/meetings.js
          node --check static/quotes.js
          node --check static/tickets.js
      - name: Verificar Python e testes de integração
        run: |
          python -m pip install -r requirements.txt pytest httpx pypdf
          python -m py_compile app.py quotes_module.py tickets_module.py
          python -m pytest -q
