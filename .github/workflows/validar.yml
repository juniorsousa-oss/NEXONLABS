name: Validar Nexon Labs
on:
  pull_request:
    paths:
      - 'app.py'
      - 'static/**'
      - 'tests/**'
      - '.github/workflows/validar.yml'
  push:
    branches: [main, feature/multi-tenant-foundation, fix/session-performance, feature/organization-branding, fix/sidebar-logo-normalization, fix/sidebar-logo-fit-v2, feature/atria-official-identity-v2, feature/atria-product-standard-layer, fix/dedicated-atria-platform-admin, fix/brand-default-loading-cache, fix/brand-loading-flash, feature/project-task-calendar-refinements, feature/notification-center-calendar-ui]
    paths:
      - 'app.py'
      - 'quotes_module.py'
      - 'tickets_module.py'
      - 'accounts_module.py'
      - 'tenant_module.py'
      - 'brand_kit.py'
      - 'approved_template.py'
      - 'static/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript
        run: |
          node --check static/app.js
          node --check static/meetings.js
          node --check static/quotes.js
          node --check static/tickets.js
          node --check static/users.js
          node --check static/brand-kit.js
          node tests/ui_lifecycle.cjs
      - name: Verificar Python e testes de integração
        run: |
          python -m pip install -r requirements.txt pytest httpx pypdf
          python -m py_compile app.py quotes_module.py tickets_module.py accounts_module.py tenant_module.py demo_seed.py brand_kit.py approved_template.py
          python -m pytest -q
      - name: Instalar navegador para validar a moldura externa
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Conferir fundo, zoom 90% e menu mobile no Chromium real
        run: node tests/ui_axora_exterior.cjs
      - name: Guardar evidências desktop e celular
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atria-axora-desktop-mobile
          path: test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14

  production:
    name: Verificar publicação real na Hostinger
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirmar arquivos visuais disponíveis no domínio publicado
        run: python scripts/check_atria_live.py
